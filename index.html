<!doctype html>
<html>
  <style>
    html, body {
      margin: 0;
      background: transparent;
      overflow: hidden;
    }
    
  </style>
  <body>
    <canvas id="c"></canvas>
    <script>
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      canvas.width = innerWidth;
      canvas.height = innerHeight;

      const S = 4;
      const W = 16, H = 18;

      const x = 100;
      const y = canvas.height - H * S;

      function R(gx, gy, gw, gh, color) {
        ctx.fillStyle = color;
        ctx.fillRect(x + gx * S, y + gy * S, gw * S, gh * S);
      }

      // Colors
      const SKIN = '#f5cfa0', HAIR = '#f3e6a8', DARK = '#2b2b3a';
      const ROBE = '#2e5e3e', SCARF2 = '#c9c9d6', LEG = '#2a2a35';

      // Head
      R(4, 3, 8, 6, SKIN);            // face
      R(3, 1, 10, 3, HAIR);           // hair on top
      R(3, 3, 2, 2, HAIR);            // side part
      R(5, 5, 2, 2, DARK);            // left eye
      R(9, 5, 2, 2, DARK);            // right eye
      R(7, 8, 2, 1, '#b5535a');       // mouth

      // Body
      R(3, 9, 10, 7, ROBE);           // robe
      R(4, 9, 8, 1, ROBE);            // scarf stripe 1
      R(4, 10, 8, 1, SCARF2);         // scarf stripe 2
      R(2, 10, 1, 4, ROBE);           // left arm
      R(13, 10, 1, 4, ROBE);          // right arm

      // Legs and shoes
      R(5, 16, 2, 2, LEG);
      R(9, 16, 2, 2, LEG);
      R(5, 17, 3, 1, DARK);
      R(8, 17, 3, 1, DARK);
    </script>
  </body>
</html>
